<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korpa</title>
</head>
<body>
    <h2>Vaša korpa</h2>

    {% if korpa %}
        <ul>
            {% for artikal in korpa %}
                <li>{{ artikal }}</li>
                <form action="{{ url_for('ukloni_iz_korpe', naziv=artikal) }}" method="post">
                    <button type="submit">Ukloni</button>
                </form>
            {% endfor %}
        </ul>
    {% else %}
        <p>Korpa je prazna.</p>
    {% endif %}

    <a href="{{ url_for('nike_duks') }}">Nazad na artikal</a>
</body>
</html>
